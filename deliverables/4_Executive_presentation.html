#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center center;background:var(--bg);overflow:hidden;box-shadow:0 10px 60px rgba(23,35,46,.15)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .35s ease,transform .35s ease,visibility 0s linear .35s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .35s ease}
.nav{position:absolute;left:0;right:0;top:0;height:76px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 48px;gap:6px}
.nav .brand{font-family:var(--head);font-weight:600;font-size:22px;color:var(--ink2);margin-right:auto}
.nav button{font:600 22px var(--text);color:var(--ink2);background:none;border:0;padding:10px 20px;border-radius:999px;cursor:pointer}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button.cur{background:var(--pri);color:#fff}
.foot{position:absolute;left:112px;right:112px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font-size:22px;color:var(--ink2)}
.foot .pg{font-family:var(--head);font-weight:600}
.body{position:absolute;left:112px;right:112px;top:118px;bottom:84px;display:flex;flex-direction:column}
.eyebrow{font:700 22px var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--pri);margin-bottom:10px}
h1.t{font-family:var(--head);font-weight:600;font-size:54px;line-height:1.12;letter-spacing:-.01em;max-width:1280px}
.lead{font-size:30px;line-height:1.4;color:var(--ink2);margin-top:16px;max-width:1500px}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;margin-top:28px}
.row{display:flex;gap:32px}
.col{display:flex;flex-direction:column;gap:24px}
.card{background:var(--card);border-radius:24px;padding:36px 40px;box-shadow:0 1px 2px rgba(23,35,46,.05),0 6px 24px rgba(23,35,46,.05)}
.card h3{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.2;margin-bottom:14px}
.card p,.card li{font-size:27px;line-height:1.45}
.muted{color:var(--ink2)}
.small{font-size:23px;line-height:1.4}
ul.clean{list-style:none;display:flex;flex-direction:column;gap:12px}
ul.clean li{padding-left:28px;position:relative}
ul.clean li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:12px;border-radius:50%;background:var(--pri)}
ul.clean.x li::before{background:var(--ink2);border-radius:2px;width:12px;height:3px;top:.72em}
.big{font-family:var(--head);font-weight:700;font-size:84px;line-height:1;letter-spacing:-.02em}
.tag{display:inline-block;font:700 21px var(--text);letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
.tag.grey{background:#EDF1F4;color:var(--ink2)}
.btns{display:flex;gap:16px;align-items:center}
.btn{font:700 24px var(--text);border-radius:999px;padding:14px 30px;cursor:pointer;border:2px solid var(--pri);background:var(--card);color:var(--pri);text-decoration:none;display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.btn:hover{background:var(--pri-soft)}
.btn.solid{background:var(--pri);color:#fff}
.btn.solid:hover{background:#09695F}
.btn.seg{border-color:var(--line);color:var(--ink2);background:var(--card)}
.btn.seg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.corner{position:absolute;right:0;top:0;display:flex;gap:14px}
.legend{display:flex;gap:28px;flex-wrap:wrap;font-size:23px;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:10px;transition:opacity .5s}
.sw{width:22px;height:22px;border-radius:6px;display:inline-block;flex:none}
table.tb{border-collapse:collapse;width:100%;font-size:25px}
table.tb th{font:700 22px var(--text);text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:left;padding:12px 18px;border-bottom:2px solid var(--line)}
table.tb td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
table.tb td.num,table.tb th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tb tr.hl td{background:var(--pri-soft)}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:#17232E;color:#EAF0F3;padding:18px 28px 22px;font:16px/1.55 var(--text);display:none;z-index:10}
#notes.show{display:block}
#notes h4{font:600 13px var(--text);letter-spacing:.1em;text-transform:uppercase;color:#9FB1BE;margin-bottom:6px}
#notes .src{color:#9FB1BE;margin-top:10px;font-size:14px}
.arrow{font-family:var(--head);font-size:44px;color:var(--ink2);display:flex;align-items:center}
.kpi .big{color:var(--ink)}
.kpi .cap{font-size:25px;color:var(--ink2);margin-top:12px;line-height:1.35}
.slide.on [data-w]{transform-origin:left center;animation:growX .6s cubic-bezier(.2,.8,.2,1)}
.slide.on [data-h]{transform-origin:center bottom;animation:growY .6s cubic-bezier(.2,.8,.2,1)}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.eq4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.row.stretch{align-items:stretch}
.seg-anim{transition:opacity .6s}
/* ---- added: motion & interactions ---- */
.card,.btn{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(23,35,46,.06),0 12px 32px rgba(23,35,46,.10)}
.btn:hover{transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rv,.card.rv{opacity:0;transform:translateY(16px);transition:opacity .4s ease,transform .4s ease}
.rv.in,.card.rv.in{opacity:1;transform:none}
.slide.on .drawY{animation:drawY .6s ease-out .15s backwards}
@keyframes drawY{from{clip-path:inset(-30px -400px 100% -30px)}to{clip-path:inset(-30px -400px 0 -30px)}}
.slide.on .phase{animation:fillX .3s ease-out backwards}
@keyframes fillX{from{clip-path:inset(0 100% 0 0 round 24px)}to{clip-path:inset(0 0 0 0 round 24px)}}
.sbar .sseg{transition:height .4s cubic-bezier(.2,.8,.2,1)}
.ytick{transition:bottom .4s}
.sim input[type=range]{flex:1;accent-color:var(--pri);height:28px;cursor:pointer}
.lnk{font:700 20px var(--text);color:var(--pri);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px 6px}
.mdot{cursor:pointer;transition:transform .2s}
.mdot:hover{transform:scale(1.25)}
.mlab{cursor:pointer}
#pop{position:absolute;width:460px;background:var(--ink);color:#fff;border-radius:16px;padding:18px 22px;font-size:22px;line-height:1.35;box-shadow:0 10px 30px rgba(23,35,46,.25);z-index:5;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
#pop.show{opacity:1;transform:none;pointer-events:auto}
#pop b{font-family:var(--head);display:block;margin-bottom:6px}
#prog{position:fixed;left:0;top:0;height:5px;width:0;background:var(--pri);z-index:15;transition:width .35s ease}
#grid{position:fixed;inset:0;background:rgba(23,35,46,.94);z-index:20;display:none;overflow:auto;padding:36px;gap:22px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-content:start}
#grid.show{display:grid}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;cursor:pointer;background:var(--bg);outline:3px solid transparent;outline-offset:2px}
.thumb:hover{outline-color:#9FD8D1}.thumb.cur{outline-color:var(--pri)}
.thumb .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(23,35,46,.82);color:#fff;font:600 15px var(--text);padding:6px 10px;z-index:2}
.thumb .slide{width:1920px;height:1080px;right:auto;bottom:auto;transform-origin:0 0;opacity:1;visibility:visible;pointer-events:none}
.thumb *{animation:none!important;transition:none!important}
.thumb .rv{opacity:1!important;transform:none!important}
.ill{fill:none;stroke:var(--pri);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible;display:block;flex:none}
.ill .a{stroke:var(--amber)}.ill .thin{stroke-width:1.6;stroke-dasharray:1;opacity:.6}
.ill .d{stroke-dasharray:1;stroke-dashoffset:0}
.slide.on .ill .d{animation:draw .7s cubic-bezier(.4,0,.2,1) var(--dl,0ms) backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.slide.on .tl{animation:fillX .7s ease-out .1s backwards}
.ring{position:absolute;border-radius:50%;border:3px solid var(--amber);pointer-events:none;opacity:0}
.slide.on .ring{animation:ring .7s ease-out .6s backwards}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.slide{transform:none}.rv,.card.rv{opacity:1;transform:none}}
.srcl{font:400 16px/1.35 var(--text);color:var(--ink2);white-space:nowrap;margin-top:6px}
.srcl.dk{color:#9FB1BE}
</style>
</head>

<div id="notes"></div>

${head('The problem · Today’s model','Reply invents the future, but others sell it.')}
<div class="content">
 <div class="viz" style="display:flex;align-items:stretch;gap:20px">
 ${steps.map((s,i)=>`${i?`<div class="arrow" data-d="${i*220-110}">→</div>`:''}<div class="card" data-d="${i*220}" style="flex:1;padding:32px 40px;min-height:270px"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="font:700 22px var(--head);color:var(--pri)">${s[0]}</div>${ic(['flask','contract','coins'][i],72,i*220+150)}</div><div class="body-text" style="font:600 32px/1.3 var(--head);margin-top:10px">${s[1]}</div></div>`).join('')}
 </div>
 <div class="card" data-d="700" style="margin-top:40px;padding:36px 40px;display:flex;align-items:center;gap:36px">
  <span class="tag grey body-text" style="flex:none">Problems</span>
  ${bad.map(b=>`<p class="body-text" style="flex:1;font-size:30px;padding-left:22px;border-left:4px solid var(--grey)">${b}</p>`).join('')}
 </div>

notes:`Here is how Reply sells today. A free pilot of about three months on one site. Then a three-year contract for the whole business, best effort, with no promised result. Revenue comes from custom projects and integration. It works, but it has three problems: value leaks to cheaper copycats once an innovation becomes standard; growth needs more consultants; and free pilots create no commitment. In short: Reply invents the future, but others sell it.

notes:`So our model has two speeds on one platform. The frontier speed is Reply as it is today: new capabilities built with large groups, sold directly, paid as projects. The mature speed takes what is proven and packages it as a managed service, sold plant by plant and through partners, paid every year plus a bonus on measured savings. Explore and prove at the frontier; package and scale at the mature speed. Reply keeps inventing, and finally earns when its ideas become standard.

notes:`Three phases. In the first six months we prove it: five conditional pilots in Northern Italy, one large group, one partner. Then we package the first agents and sign more partners. By month 36: 25 accounts, 6 partners, about 300 plants, and Germany ready. We steer by four numbers, and we would stop and rethink if pilot conversion stays under 30 percent. To close: Reply keeps inventing the future. With this model, it also sells it. Thank you.
[Other stop criterion: measured gain below 2% of the bill.]

ANSWERS TO LIKELY JURY QUESTIONS
1. Why pay a bonus if you guarantee nothing? Upside only. The client pays more only when savings are measured, against a baseline agreed in writing before the pilot.
2. Does packaging kill Reply’s innovation identity? No. The mature speed funds the frontier speed; co-innovation with large groups stays.
3. Why would a partner not build its own? Neutrality, time to market, audit trail ready for the AI Act, no team to maintain.
4. What if a battery maker gives its software away? We do not sell battery optimisation. We run the whole site, and most Italian sites have no battery (only 91 MWh of commercial storage connected in Q1 2026).
5. Is €10k per plant too expensive? It is a service run by Reply’s experts, not software. It is under 1% of the bill, and the client gains about €3 for every €1 paid.
6. Your numbers depend on your assumptions? Yes, and they are all declared. See the stress test (backup): even at 30% conversion with no partner, revenue per person is about €230k.
7. Why not utilities, which also score high? Long sales cycles and many own competing platforms; we reach them later through partnerships.
8. Is it safe to let AI control energy assets? Agents plan; fixed controls enforce safety limits; every action is logged.
9. Why Italy first? Highest prices, emptier field, home market. Germany is phase 2 (2029 grid-fee reform).`,

function applyRv(fresh){
  const el=byId[cur].el;
  el.querySelectorAll('[data-r]').forEach(x=>{ const show=+x.dataset.r<=rv, was=x.classList.contains('in');
    x.classList.toggle('in',show); if(show&&!was&&!fresh) x.querySelectorAll('.cnt,.big').forEach(countUp); });
}
function enter(el){
  if(RM) return;
  let i=0;
  el.querySelectorAll('.card,[data-d]').forEach(c=>{ if(c.classList.contains('nofade')) return;
    const dl = c.dataset.d!=null ? +c.dataset.d : Math.min((i++)*60,300);
    c.style.animation='none'; void c.offsetWidth; c.style.animation=`fadeUp .45s cubic-bezier(.2,.8,.2,1) ${dl}ms backwards`; });
  el.querySelectorAll('.big:not(.nocnt),.cnt').forEach(n=>{ if(!n.closest('.rv:not(.in)')) countUp(n); });
}
function countUp(el){
  if(RM||document.hidden) return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), items=[];
  while(w.nextNode()) if(/\d/.test(w.currentNode.nodeValue)) items.push({n:w.currentNode,t:w.currentNode.nodeValue});
  if(!items.length) return;
  const delay=+(el.dataset.delay||0), D=600, id=(el._cu=(el._cu||0)+1);
  const fmt=(t,k)=>t.replace(/\d+(?:\.\d+)?/g,m=>(parseFloat(m)*k).toFixed((m.split('.')[1]||'').length));
  const done=()=>{ if(el._cu===id) items.forEach(it=>{ it.n.nodeValue=it.t; }); };
  items.forEach(it=>it.n.nodeValue=fmt(it.t,0));
  const t0=performance.now()+delay;
  function f(t){ if(el._cu!==id) return; const k=Math.max(0,Math.min(1,(t-t0)/D)), e=1-Math.pow(1-k,3);
    items.forEach(it=>it.n.nodeValue=fmt(it.t,e)); if(k<1) requestAnimationFrame(f); else done(); }
  requestAnimationFrame(f); setTimeout(done, delay+D+150);
}
function go(id,push,how){
  if(!byId[id]) return; if(id===cur) return;
  if(push && cur) hist.push(cur);
  closePop();
  if(cur) byId[cur].el.classList.remove('on');
  const {s,el}=byId[id]; cur=id;
  rv = (how==='fwd' && !RM) ? 0 : s.rmax; applyRv(true);
  el.classList.add('on');
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
  if(s.onShow) s.onShow();
  enter(el);
  const mi = MAIN.indexOf(s.detail||id);
  document.getElementById('prog').style.width=((mi+1)/MAIN.length*100)+'%';
  document.getElementById('notes').innerHTML=`<h4>Speaker notes · ${s.label}${s.t?' · target '+s.t+' s':''}</h4><div>${s.notes.replace(/\n/g,'<br>')}</div><div class="src">Sources: ${s.src}</div>`;
}
function goBack(def){ const t = hist.length? hist.pop() : def; if(t===cur) return; go(t,false); }
function step(d){
  const s=byId[cur].s;
  if(s.rmax && !RM){
    if(d>0 && rv<s.rmax){ rv++; applyRv(); return; }
    if(d<0 && rv>0){ rv--; applyRv(); return; }
  }
  const i = MAIN.indexOf(cur);
  if(i<0){ goBack(s.detail); return; }
  const j = Math.max(0,Math.min(MAIN.length-1,i+d)); if(j===i) return;
  go(MAIN[j],false,d>0?'fwd':'back');
}
function tween(el,to,dec=0){
  const from = parseFloat(el.dataset.v ?? el.textContent)||0; el.dataset.v=to; const fin=to.toFixed(dec);
  if(RM||document.hidden||from===to){ el.textContent=fin; return; }
  const t0=performance.now(), D=600;
  function f(t){ if(el.dataset.v!=String(to)) return; const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3); el.textContent=(from+(to-from)*e).toFixed(dec); if(k<1) requestAnimationFrame(f); else el.textContent=fin; }
  requestAnimationFrame(f); setTimeout(()=>{ if(el.dataset.v==String(to)) el.textContent=fin; }, D+150);
}
/* plant simulator */
let GWH=5;
function renderSim(){
  const k=window._scen||'base', res={}; Object.keys(SC).forEach(c=>res[c]=plant(c,GWH));
  const mx=Math.max(100000,Math.ceil(Math.max(...Object.values(res).map(r=>r.t))/100000)*100000);
  document.querySelectorAll('#sl-s7 .yl').forEach((l,i)=>{ l.textContent='€'+Math.round(mx/4*i/1000)+'k'; });
  document.querySelectorAll('#sl-s7 .sbar').forEach(b=>{ const r=res[b.dataset.case];
    b.style.opacity=b.dataset.case===k?1:.3;
    b.querySelectorAll('.sseg').forEach(sg=>{ sg.style.height=(r.v[+sg.dataset.i]/mx*100)+'%'; });
    tween(b.querySelector('.tot'),Math.round(r.t/1000)); });
  const r=res[k];
  document.querySelectorAll('[data-scen]').forEach(b=>b.classList.toggle('on',b.dataset.scen===k));
  r.v.forEach((v,i)=>tween(document.getElementById('v7-'+i),Math.round(v/1000)));
  tween(document.getElementById('t7'),Math.round(r.t/1000)); tween(document.getElementById('r7'),Math.round(r.paid/1000)); tween(document.getElementById('c7'),Math.round(r.kept/1000));
  document.getElementById('p7').textContent=(r.share*100).toFixed(1)+'%'; document.getElementById('n7').textContent=SC[k].name;
  document.getElementById('bill7').textContent='€'+(GWH*278000/1e6).toFixed(2)+'M'; document.getElementById('gb7').textContent=GWH; document.getElementById('gv').textContent=GWH; document.getElementById('g7').textContent=GWH; document.getElementById('gwh').value=GWH;
}
function setScen(k){ window._scen=k; renderSim(); }
function setGwh(v){ GWH=Math.max(2,Math.min(20,+v)); renderSim(); }
/* stress buttons */
function setStress(k,quiet){
  const s=STR[k], b=document.getElementById('bigS');
  document.querySelectorAll('[data-str]').forEach(x=>x.classList.toggle('on',x.dataset.str===k));
  b._cu=(b._cu||0)+1;
  b.textContent='€124k → '+s[2]; document.getElementById('k3y').textContent=s[1]; document.getElementById('kpp').textContent=s[2];
  document.getElementById('capS').textContent = k==='base' ? 'revenue per person · partners carry 244 of 300 plants' : 'revenue per person, year 3 · stress scenario';
  if(!quiet && !RM){ ['k3y','kpp'].forEach(i=>{ const c=document.getElementById(i); c.style.animation='none'; void c.offsetWidth; c.style.animation='fadeUp .35s ease backwards'; }); countUp(b); }
}
/* competitor pop-up */
function openPop(i){
  const p=pts[i], pop=document.getElementById('pop'); if(!pop) return;
  const d=p[3]==1?40:24, x=p[1]*MW, y=(1-p[2])*MH;
  pop.innerHTML=`<b>${p[0]}</b>${p[5]}${p[6]?`<div class="srcl dk">${p[6]}</div>`:''}`;
  const left = x>MW*.55 ? x-d/2-16-460 : x+d/2+16;
  pop.style.left=left+'px'; pop.style.top=Math.max(8,Math.min(MH-170,y-30))+'px';
  pop.classList.add('show'); pop.dataset.i=i;
}
function closePop(){ const p=document.getElementById('pop'); if(p){ p.classList.remove('show'); delete p.dataset.i; } }
const popOpen=()=>{ const p=document.getElementById('pop'); return p&&p.classList.contains('show'); };
/* overview grid */
const grid=document.getElementById('grid');
function openGrid(){
  grid.innerHTML='';
  S.forEach(s=>{ const t=document.createElement('div'); t.className='thumb'+(s.id===cur?' cur':''); t.dataset.id=s.id;
    const c=byId[s.id].el.cloneNode(true); c.removeAttribute('id'); c.classList.add('on'); c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    t.appendChild(c); t.insertAdjacentHTML('beforeend',`<div class="lbl">${s.detail?'Backup':MAIN.indexOf(s.id)+1} · ${(s.html.match(/<h1 class="t"[^>]*>([\s\S]*?)<\/h1>/)||[,''])[1].replace(/<br>/g,' ').replace(/<[^>]+>/g,'')}</div>`);
    grid.appendChild(t); });
  grid.classList.add('show');
  grid.querySelectorAll('.thumb').forEach(t=>{ t.firstChild.style.transform=`scale(${t.clientWidth/1920})`; });
}
function closeGrid(){ grid.classList.remove('show'); grid.innerHTML=''; }
document.addEventListener('click',e=>{
  if(e.target.closest('#notes')) return;
  if(e.target.closest('#grid')){ const t=e.target.closest('.thumb'); closeGrid(); if(t) go(t.dataset.id,true); return; }
  const dp=e.target.closest('[data-pop]'); if(dp){ openPop(+dp.dataset.pop); return; }
  if(e.target.closest('#pop')) return;
  if(popOpen()){ closePop(); return; }
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go,true); return; }
  const b=e.target.closest('[data-back]'); if(b){ goBack(b.dataset.back); return; }
  const sc=e.target.closest('[data-scen]'); if(sc){ setScen(sc.dataset.scen); return; }
  const st=e.target.closest('[data-str]'); if(st){ setStress(st.dataset.str); return; }
  if(e.target.closest('[data-reset]')){ setGwh(5); return; }
  if(e.target.closest('a,button,input,label,.sim')) return;
  if(e.target.closest('#stage')) step(1);
});
document.addEventListener('mouseover',e=>{ const dp=e.target.closest('[data-pop]'); if(dp && document.getElementById('pop').dataset.i!=dp.dataset.pop) openPop(+dp.dataset.pop); });
document.addEventListener('input',e=>{ if(e.target.id==='gwh') setGwh(e.target.value); });
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(grid.classList.contains('show')){ if(k==='g'||k==='G'||k==='Escape'){ e.preventDefault(); closeGrid(); } return; }
  if(e.target.tagName==='INPUT' && /^Arrow|^Page|^Home|^End/.test(k)) return;
  if(k==='Escape'){ closePop(); return; }
  if(cur==='s7' && e.shiftKey && /^Digit[123]$/.test(e.code)){ setScen(['cautious','base','opt'][+e.code.slice(5)-1]); return; }
  if(/^[1-9]$/.test(k)){ if(MAIN[+k-1]) go(MAIN[+k-1],true); return; }
  if(['ArrowRight','PageDown',' '].includes(k)){ e.preventDefault(); step(1); }
  else if(['ArrowLeft','PageUp'].includes(k)){ e.preventDefault(); step(-1); }
  else if(k==='g'||k==='G'){ openGrid(); }
  else if(k==='h'||k==='H'||k==='Home'){ go('s2',true); }
  else if(k==='b'||k==='B'||k==='Backspace'){ if(byId[cur].s.detail) goBack(byId[cur].s.detail); }
  else if(k==='n'||k==='N'){ document.getElementById('notes').classList.toggle('show'); }
  else if(k==='f'||k==='F'){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); }catch(_){} }
});
function fit(){ const s=Math.min(innerWidth/1920,innerHeight/1080); stage.style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();
addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(byId[h]&&h!==cur) go(h,false); });
go(byId[location.hash.slice(1)]?location.hash.slice(1):'s1',false);
</script>
